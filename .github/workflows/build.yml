name: Build GlassIntro
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compile
        shell: pwsh
        run: |
          dotnet build GlassIntro.csproj -c Release --nologo -v q -clp:NoSummary 2>&1 | Tee-Object build.log
          if ($LASTEXITCODE -ne 0) {
            Select-String -Path build.log -Pattern ': error ' | Select-Object -First 20 | ForEach-Object { Write-Host "::error::$($_.Line)" }
            exit 1
          }
      - uses: actions/upload-artifact@v4
        with:
          name: GlassIntro
          path: bin/out/
  smoke-test:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: GlassIntro
      - name: Start app and check a test window
        shell: powershell
        run: |
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type 'using System;using System.Runtime.InteropServices;public class W{[DllImport("user32.dll",EntryPoint="GetWindowLongPtrW")]public static extern IntPtr G(IntPtr h,int i);}'
          $app = Start-Process .\GlassIntro.exe -PassThru
          $form = New-Object System.Windows.Forms.Form
          $form.Text = 'glass-test'
          $form.Show()
          1..100 | ForEach-Object { [System.Windows.Forms.Application]::DoEvents(); Start-Sleep -Milliseconds 100 }
          $ex = [W]::G($form.Handle, -20).ToInt64()
          $crashed = $app.HasExited
          if (-not $crashed) { Stop-Process -Id $app.Id -Force }
          $log = Join-Path $env:APPDATA 'GlassIntro\error.log'
          if (Test-Path $log) { Get-Content $log -TotalCount 6 | ForEach-Object { Write-Host "::error::$_" } ; exit 1 }
          if ($crashed) { Write-Host "::error::GlassIntro crashed"; exit 1 }
          if (($ex -band 0x80000) -eq 0) { Write-Host "::error::Window did not become layered"; exit 1 }
