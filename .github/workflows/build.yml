name: Build GlassIntro
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile
        shell: cmd
        run: '"%WINDIR%\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo /target:winexe /platform:x64 /optimize+ /codepage:65001 /out:GlassIntro.exe /r:System.Windows.Forms.dll /r:System.Drawing.dll GlassIntro.cs'
      - uses: actions/upload-artifact@v4
        with:
          name: GlassIntro
          path: GlassIntro.exe
  smoke-test:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: GlassIntro
      - name: Check that a test window becomes glass
        shell: powershell
        run: |
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type 'using System;using System.Runtime.InteropServices;public class W{[DllImport("user32.dll",EntryPoint="GetWindowLongPtrW")]public static extern IntPtr G(IntPtr h,int i);}'
          $app = Start-Process .\GlassIntro.exe -PassThru
          $form = New-Object System.Windows.Forms.Form
          $form.Text = 'glass-test'
          $form.Show()
          1..80 | ForEach-Object { [System.Windows.Forms.Application]::DoEvents(); Start-Sleep -Milliseconds 100 }
          $ex = [W]::G($form.Handle, -20).ToInt64()
          Write-Host ("ExStyle: 0x{0:X}, exited: {1}" -f $ex, $app.HasExited)
          $crashed = $app.HasExited
          if (-not $crashed) { Stop-Process -Id $app.Id -Force }
          if ($crashed) { throw 'GlassIntro crashed' }
          if (($ex -band 0x80000) -eq 0) { throw 'Window did not become layered' }
